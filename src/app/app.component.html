<div class="d-flex flex-column min-vh-100">
  <header class="bg-dark text-white py-3 mb-4">
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand d-flex align-items-center" routerLink="#">
          <img
            src="assets/images/checklist.png"
            alt="Task Manager Logo" width="60" height="60" class="me-2">
          <span>Task Manager</span>
        </a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" routerLink="/tasks" routerLinkActive="active">Tasks</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/users" routerLinkActive="active">Users</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" routerLink="/departments" routerLinkActive="active">Departments</a>
              </li>
          </ul>

          <button class="btn btn-secondary mr-5" (click)="logOutUser()">Log out</button>

          <button *ngIf="getCurrentRoute() === 'tasks'" class="btn btn-light ms-auto" data-bs-toggle="modal"
            data-bs-target="#newTaskModal">Create Task</button>
          <button *ngIf="getCurrentRoute() === 'users'" class="btn btn-light ms-auto" data-bs-toggle="modal"
            data-bs-target="#newUserModal">Create User</button>
          <button *ngIf="getCurrentRoute() === 'departments'" class="btn btn-light ms-auto" data-bs-toggle="modal"
            data-bs-target="#newDepartmentModal">Create Department</button>
        </div>
      </nav>
    </div>
  </header>
  
  <main class="container flex-grow-1">
    <router-outlet />
  </main>

  <footer class="bg-dark text-white py-3 mt-auto">
    <div class="container text-center d-flex justify-content-between align-items-center">
      <span>&copy; 2024 Task Manager. All rights reserved.</span>
      <button class="btn btn-warning" (click)="emptyLocalStorage()">Empty local storage</button>
    </div>
  </footer>
</div>
