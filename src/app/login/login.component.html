<div class="row"  >
    <div class="col-12">
        <p class="my-4">Check the readme for login credentials</p>
        <form name="loginForm" class="loginForm mt-4" action="#" method="POST" >
            <div class="form-group my-2 w-50">
                <input type="email" #userEmailInput class="form-control email" name="emailId" required
                    placeholder="Email address">
            </div>
            <div class="form-group my-2 w-50">
                <div class="pwdMask">
                    <span class="d-flex">
                        <input type="text"  #userPasswordInput class="form-control password" name="password"
                            placeholder="Password">
                    </span>
                </div>
            </div>
            <div class="form-group mt-4 w-50">
                <button class="btn btn-primary w-100" (click)="loginUser()" type="button">
                    Login
                </button>
            </div>
        </form>
    </div>
    <div class="col-12" *ngIf="invalidLoginCredentials === true">
        These login credentials are invalid
    </div>
</div>
