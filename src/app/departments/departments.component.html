<app-new-department></app-new-department>
<div class="row">
    <div class="col-4">
        <ul class="list-group mb-5">
            <li *ngFor="let department of department_list" class="list-group-item department d-flex align-items-center gap-3">
                <span class="name">{{department.name}}</span>
                <a role="button" (click)="setDepartmentToView(department.id)"
                    class="ml-auto w-4 h-4 d-flex align-items-center justify-content-center">
                    <i class="bi bi-eye text-success display-icon"></i></a>
            </li>
        </ul>
    </div>
    <div class="col-8">
        <app-department-detail></app-department-detail>
    </div>
</div>
