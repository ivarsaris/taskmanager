<div *ngIf="currentDepartmentToView !== undefined" class="card">
    <div class="card-body">
        <div class="d-flex align-items-center">
            <h3 class="card-title">{{currentDepartmentToView.name}}</h3>
        </div>
        <div class="card-body row">
            <div *ngFor="let user of currentDepartmentUsers" class="cart-item col-12 col-md-6">
                <h4>{{user.name}}</h4>
            </div>
        </div>
    </div>
</div>
